# Local development database only.   docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: itam_master
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: itam
    ports: ["5432:5432"]
    volumes: ["itam-db:/var/lib/postgresql/data"]
volumes:
  itam-db:
