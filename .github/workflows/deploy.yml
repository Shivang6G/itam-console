name: deploy
on:
  # Manual only until the GitHub variables AWS_DEPLOY_ROLE_ARN and TF_STATE_BUCKET are set (see docs/RUNBOOK.md).
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [demo, prod]
        default: demo

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'demo' }}
  cancel-in-progress: false

permissions:
  id-token: write # GitHub OIDC -> AWS, no stored keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Manual run. Prod waits for the reviewers configured on the `prod` GitHub Environment.
    environment: ${{ github.event.inputs.environment || 'demo' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required repository variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          missing=0
          for v in AWS_DEPLOY_ROLE_ARN TF_STATE_BUCKET ADMIN_EMAIL ALERT_EMAIL; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set (Settings > Secrets and variables > Actions > Variables)"; missing=1; fi
          done
          exit $missing
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.16.6 } # must be >= the version that wrote the state (local runs used 1.16.6)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Write Terraform inputs
        run: |
          ENV="${{ github.event.inputs.environment || 'demo' }}"
          cat > infra/envs/$ENV/backend.hcl <<EOT
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          region = "${{ vars.AWS_REGION || 'ap-south-1' }}"
          EOT
          cat > infra/envs/$ENV/terraform.tfvars <<EOT
          admin_email = "${{ vars.ADMIN_EMAIL }}"
          alert_email = "${{ vars.ALERT_EMAIL }}"
          EOT
      - name: Deploy
        run: bash scripts/deploy.sh "${{ github.event.inputs.environment || 'demo' }}" "${GITHUB_SHA::12}"
