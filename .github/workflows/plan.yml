name: terraform-plan
on:
  pull_request:
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix: { env: [demo, prod] }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.16.6 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Plan ${{ matrix.env }}
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          cat > backend.hcl <<EOT
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          region = "${{ vars.AWS_REGION || 'ap-south-1' }}"
          EOT
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -lock=false -no-color \
            -var admin_email="${{ vars.ADMIN_EMAIL }}" -var alert_email="${{ vars.ALERT_EMAIL }}" \
            -var image_tag="$(bash ../../../scripts/current-image-tag.sh ${{ matrix.env }} 2>/dev/null || echo bootstrap)" | tee plan.txt
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: plan-${{ matrix.env }}
          message: |
            ### Terraform plan: ${{ matrix.env }}
            ```
            $(tail -c 60000 infra/envs/${{ matrix.env }}/plan.txt)
            ```
